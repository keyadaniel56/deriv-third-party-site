# Netlify deployment config for TradersUnit (static site, no build step)

[build]
  publish = "."
  command = "echo 'Static site — no build step required.'"

[build.environment]
  NODE_VERSION = "20"

# Bot-app SPA rewrite: serve bot-builder/index.html for all /bot-builder/* routes
[[redirects]]
  from = "/bot-builder/*"
  to = "/bot-builder/index.html"
  status = 200

# Basic security headers for the whole site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
